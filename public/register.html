<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a CodeBD account to start solving problems, entering contests, and tracking your progress.">
    <title>Register - CodeBD</title>
    <link rel="stylesheet" href="/css/register.css">
</head>

<body>

    <h1>Create Account</h1>

    <form id="registerForm">

        <div id="registerError" class="form-error" style="display:none;"></div>

        <div>
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
            >
        </div>

        <div>
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >
        </div>

        <button type="submit" id="registerBtn">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="/auth/login">Login</a>
    </p>
    <script src="/js/register.js"></script>
</body>
</html>
